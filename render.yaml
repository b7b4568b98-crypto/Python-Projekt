services:
  - type: web
    # Name des bereits eingerichteten Render-Services beibehalten.
    name: python-projekt-formular
    runtime: python
    plan: free
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
